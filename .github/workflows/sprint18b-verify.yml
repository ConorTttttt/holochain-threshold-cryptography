name: Sprint 1.8B candidate verification

# Experimental, disposable-only validation on the isolated PR #19 branch.
on:
  push:
    branches:
      - sprint18b/compile-security-verification-20261116
      - claude/holochain-threshold-crypto-sprint18b-gocnij
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint18b-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: "4"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never

jobs:
  native:
    name: Workspace, native security and SDK
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Fetch pinned dependencies
        run: nix develop --no-write-lock-file --command cargo fetch --locked
      - name: Compile all supported targets and execute native regressions
        shell: bash
        run: |
          mkdir -p /tmp/dkg-sprint18b-native
          nix develop --no-write-lock-file --command bash -uo pipefail -c '
            export CARGO_NET_OFFLINE=true TMPDIR=/tmp/dkg-sprint18b-native
            git rev-parse HEAD
            rustc --version
            cargo --version
            # Every gate runs and is recorded; one failure must not hide the
            # rest as "never reached". The job still fails if any gate fails.
            failed=()
            gate() { echo "::group::GATE $*"; if "$@"; then echo "GATE-RESULT PASS: $*"; else echo "GATE-RESULT FAIL($?): $*"; failed+=("$*"); fi; echo "::endgroup::"; }
            gate cargo check --locked --workspace --all-targets
            gate cargo test --locked -p holochain-mpc-dkg-worker --test share_custody
            gate cargo test --locked -p holochain-mpc-dkg-worker --lib round_two_uniqueness_tests
            gate cargo test --locked -p holochain-mpc-dkg-worker --test round_two_security
            gate cargo test --locked -p holochain-mpc-core
            gate cargo test --locked -p holochain-mpc-security
            gate cargo test --locked -p holochain-mpc-runtime
            gate cargo test --locked -p holochain-mpc-frost-ed25519
            # Conductor-requiring binaries (conductor_bridge, three_processes,
            # capability_provisioning) need the hApp and run in the conductor job.
            gate cargo test --locked -p holochain-mpc-dkg-worker --no-fail-fast --lib --bins --test dkg_restart --test input_validation --test ipc_process --test node_service --test relay_simulation --test round_two_security --test share_custody --test signing_session
            gate cargo test --locked -p holochain-mpc-dkg-worker --features conductor-client --no-fail-fast --lib --bins
            gate cargo test --locked -p holochain-mpc-dkg-worker --features lair-signer --no-fail-fast --lib --bins --test transport_probe
            gate cargo test --locked -p holochain-dkg-sdk --all-targets
            gate cargo test --locked -p holochain-dkg-sdk --features native-holochain --all-targets
            gate cargo check --locked -p holochain-mpc-dkg-worker --all-targets
            gate cargo check --locked -p holochain-mpc-dkg-worker --features conductor-client --all-targets
            gate cargo check --locked -p holochain-mpc-dkg-worker --features lair-signer --all-targets
            gate git diff --exit-code -- Cargo.lock scripts/release_inventory.json scripts/release_hashes.json
            echo "FAILED GATES: ${#failed[@]}"; printf "  %s\n" "${failed[@]}"
            [ "${#failed[@]}" -eq 0 ]
          '

  conductor:
    name: Disposable hApp build and Holochain security Sweettests
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Fetch pinned dependencies
        run: nix develop --no-write-lock-file --command cargo fetch --locked
      - name: Build disposable hApp and run actual conductor tests
        shell: bash
        run: |
          mkdir -p /tmp/dkg-sprint18b-conductor
          nix develop --no-write-lock-file --command bash -uo pipefail -c '
            export CARGO_NET_OFFLINE=true TMPDIR=/tmp/dkg-sprint18b-conductor RUST_TEST_THREADS=1
            git rev-parse HEAD
            rustc --version
            cargo --version
            hc --version
            failed=()
            gate() { echo "::group::GATE $*"; if "$@"; then echo "GATE-RESULT PASS: $*"; else echo "GATE-RESULT FAIL($?): $*"; failed+=("$*"); fi; echo "::endgroup::"; }
            gate npm run build:happ
            # Same suites as `npm run test:sweettest`, as separate recorded gates.
            gate cargo test -p mpc --test mpc_network -- --nocapture
            gate cargo test -p mpc --test dkg_live -- --nocapture
            gate cargo test -p mpc --test inbox_hardening -- --nocapture --test-threads=1
            gate cargo test --locked -p mpc --test fable_conductor_adversarial -- --nocapture --test-threads=1
            gate cargo test -p holochain-mpc-dkg-worker --test three_processes -- --nocapture
            gate cargo test -p holochain-mpc-dkg-worker --test conductor_bridge -- --nocapture
            gate cargo test --locked -p holochain-mpc-dkg-worker --features lair-signer --test capability_provisioning -- --nocapture
            gate git diff --exit-code -- Cargo.lock scripts/release_inventory.json scripts/release_hashes.json
            echo "FAILED GATES: ${#failed[@]}"; printf "  %s\n" "${failed[@]}"
            [ "${#failed[@]}" -eq 0 ]
          '
