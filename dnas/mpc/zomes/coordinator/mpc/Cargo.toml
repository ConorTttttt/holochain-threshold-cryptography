[package]
name = "mpc"
version = "0.3.3"
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
hdk = { workspace = true }
serde = { workspace = true }
mpc_integrity = { path = "../../integrity/mpc_integrity" }
serde_json = "1.0"
holochain-mpc-core = { path = "../../../../../crates/mpc-core" }
holochain-mpc-adapter = { path = "../../../../../adapters/holochain-0.7" }

[dev-dependencies]
holochain = { version = "=0.7.1", default-features = false, features = ["wasmer-sys-cranelift", "test_utils", "encryption"] }
tokio = { version = "1", features = ["full"] }
