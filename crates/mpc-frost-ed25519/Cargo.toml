[package]
name = "holochain-mpc-frost-ed25519"
version = "0.3.4"
edition = "2021"
license = "Apache-2.0"
description = "Native FROST-Ed25519 distributed key generation and threshold signing provider for Holochain MPC Core"

[dependencies]
holochain-mpc-core = { path = "../mpc-core" }
holochain-mpc-security = { path = "../mpc-security" }
holochain-mpc-runtime = { path = "../mpc-runtime" }
frost-ed25519 = { version = "=3.0.0", features = ["serialization"] }
# Use the pinned upstream individual-share verifier for authenticated attribution.
frost-core = "=3.0.0"
rand = "0.8.5"
serde = { workspace = true }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3"
