[package]
name = "holochain-mpc-dkg-worker"
version = "0.3.8"
edition = "2021"
license = "Apache-2.0"
description = "Experimental process-isolated FROST DKG controller for Holochain MPC"

[[bin]]
name = "mpc-dkg-worker"
path = "src/main.rs"

[[bin]]
name = "mpc-node"
path = "src/node_main.rs"

[dependencies]
holochain-mpc-core = { path = "../mpc-core" }
holochain-mpc-security = { path = "../mpc-security" }
holochain-mpc-frost-ed25519 = { path = "../mpc-frost-ed25519" }
holochain-mpc-runtime = { path = "../mpc-runtime" }
serde = { workspace = true }
serde_json = "1.0"
hmac = "0.12.1"
sha2 = "0.10.9"
zeroize = "1.8"
libc = "0.2"

[dev-dependencies]
rand = "0.8.5"
tempfile = "3"
rusqlite = { version = "0.37", features = ["bundled"] }
hdk = { workspace = true }
holochain = { version = "=0.7.1", default-features = false, features = ["wasmer-sys-cranelift", "test_utils", "encryption"] }
tokio = { version = "1", features = ["full"] }
mpc = { path = "../../dnas/mpc/zomes/coordinator/mpc" }
